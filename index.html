<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>document.documentElement.classList.add("lp-locked")</script>
<style id="lp-login-css">html.lp-locked #root{visibility:hidden!important}
#lp-gate{position:fixed;inset:0;z-index:200000;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;background:radial-gradient(120% 90% at 20% 0%,#3a1a8f 0%,#160b3a 55%,#0d0626 100%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#lp-gate *{box-sizing:border-box}
#lp-gate .bub{position:absolute;bottom:-60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,.04) 60%);animation:lpRise linear infinite;pointer-events:none}
@keyframes lpRise{to{transform:translateY(-115vh) translateX(var(--dx,0px))}}
#lp-card{position:relative;width:100%;max-width:380px;padding:26px 22px 22px;border-radius:26px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#lp-card.shake{animation:lpShake .4s}
@keyframes lpShake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#lp-logo{display:block;width:112px;height:112px;margin:-70px auto 12px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 5px rgba(233,30,140,.55),0 10px 30px rgba(123,47,255,.55);background:#fff}
#lp-card h1{margin:0;font-family:inherit;text-align:center;font-size:22px;font-weight:800;letter-spacing:.2px}
#lp-card p.sub{margin:4px 0 18px;text-align:center;font-size:13.5px;color:rgba(255,255,255,.72)}
#lp-card label{display:block;margin:12px 0 6px;font-size:13px;font-weight:700;color:rgba(255,255,255,.88)}
#lp-card .fld{position:relative}
#lp-card input[type=text],#lp-card input[type=password]{width:100%;height:50px;padding:0 48px 0 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:rgba(10,5,35,.45);color:#fff;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
#lp-card input::placeholder{color:rgba(255,255,255,.4)}
#lp-card input:focus{border-color:#ff5aa5;box-shadow:0 0 0 3px rgba(233,30,140,.28)}
#lp-card .eye{position:absolute;right:4px;top:4px;width:42px;height:42px;border:0;border-radius:10px;background:transparent;color:rgba(255,255,255,.75);font-size:13px;font-weight:700;cursor:pointer}
#lp-card .eye:focus-visible,#lp-card button:focus-visible,#lp-card a:focus-visible{outline:2px solid #fff;outline-offset:2px}
#lp-card .row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;font-size:13px}
#lp-card .row label{margin:0;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
#lp-card .row input[type=checkbox]{width:18px;height:18px;accent-color:#E91E8C}
#lp-card a.lnk{color:#ffb3d9;font-weight:700;text-decoration:underline;cursor:pointer;background:none;border:0;font-size:13px;padding:6px 0}
#lp-card button.go{width:100%;height:52px;margin-top:16px;border:0;border-radius:15px;background:linear-gradient(135deg,#E91E8C,#7B2FFF);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(233,30,140,.4);transition:transform .1s,opacity .15s}
#lp-card button.go:active{transform:scale(.98)}
#lp-card button.go:disabled{opacity:.55}
#lp-card .err{min-height:20px;margin:10px 0 0;font-size:13.5px;font-weight:600;color:#ffd0e6;text-align:center}
#lp-card .note{margin:12px 0 0;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.6);text-align:center}
#lp-card .code{margin:14px 0;padding:14px;border-radius:14px;border:1.5px dashed #ff5aa5;background:rgba(10,5,35,.5);text-align:center;font:800 26px ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;user-select:all}
#lp-card .foot{margin-top:16px;text-align:center;font-size:12px;color:rgba(255,255,255,.45)}
#lp-acc-ov{position:fixed;inset:0;z-index:100002;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px;font-family:system-ui,sans-serif}
#lp-acc{width:100%;max-width:420px;max-height:92vh;overflow-y:auto;background:#1E1E3A;color:#fff;border:1px solid #3a3a5a;border-radius:20px;padding:18px}
#lp-acc h3{margin:0 0 12px;font-size:18px;font-weight:800}
#lp-acc .u{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin:6px 0;border-radius:12px;background:#2A2A4A;font-size:14px}
#lp-acc .u small{color:#b9b9d6}
#lp-acc input,#lp-acc select{width:100%;height:44px;margin:6px 0;padding:0 12px;border-radius:12px;border:1px solid #3a3a5a;background:#12122b;color:#fff;font-size:15px}
#lp-acc button{display:block;width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #3a3a5a;background:#2A2A4A;color:#fff;font-weight:700;font-size:14px}
#lp-acc button.pk{background:linear-gradient(135deg,#E91E8C,#7B2FFF);border:0}
#lp-acc button.rd{background:#7a1630;border-color:#7a1630}
#lp-acc button.sm{display:inline-block;width:auto;margin:0;padding:6px 10px;font-size:12px}
#lp-acc h4{margin:16px 0 4px;font-size:14px;font-weight:800}
@media (prefers-reduced-motion:reduce){#lp-gate .bub{animation:none;opacity:.35}#lp-card.shake{animation:none}}
#lp-badge{position:fixed;left:50%;transform:translateX(-50%);bottom:3px;white-space:nowrap;z-index:9990;padding:3px 9px;border-radius:999px;font:600 11px system-ui,sans-serif;color:#fff;background:rgba(22,11,58,.78);border:1px solid rgba(255,255,255,.2);pointer-events:none;opacity:.9}
#lp-badge.warn{background:#7a1630}
html.lp-locked #lp-badge{display:none}
</style>
</head>

   else{var c=Math.ceil(v.length/CH);b.set(ref,{parts:c,t:Date.now(),by:who});for(var i=0;i<c;i++)b.set(F.doc(db,'data',k+'~p'+i),{s:v.slice(i*CH,(i+1)*CH)})}

  if(!n)return;

L.wipe=function(keep){

  var F=m.F;
  return F.getDocs(F.collection(db,'data')).then(function(snap){
   var b=F.writeBatch(db),n=0;
   snap.forEach(function(d){var id=d.id,base=id.indexOf('~p')>=0?id.slice(0,id.indexOf('~p')):id;if(base!==keep){b.delete(F.doc(db,'data',id));n++}});

L.addStaff=function(username,pw){
 var u=String(username).trim().toLowerCase();
 if(!/^[a-z0-9._-]{3,30}$/.test(u))return Promise.reject({code:'lp/badname'});
 return L.load().then(function(m){
  var A=m.A,Au=m.Au,F=m.F,app2=A.initializeApp(C,'sec'+Date.now()),a2=Au.getAuth(app2),email=toEmail(u);
  return Au.createUserWithEmailAndPassword(a2,email,pw).then(function(c){

  }).then(function(){return Au.signOut(a2)}).then(function(){return A.deleteApp(app2)},function(e){return A.deleteApp(app2).then(function(){throw e},function(){throw e})});
 });

 flush();
 var wait=Promise.race([Promise.all(inflight),new Promise(function(r){setTimeout(r,5000)})]);

};

 if(c.indexOf('permission')>=0)return'Walang pahintulot sa database. Siguraduhing nailagay na ang Firestore rules.';
 if(c.indexOf('email-already')>=0)return'May gumagamit na ng username na iyan.';
 if(c.indexOf('weak')>=0)return'Ang password ay dapat 6 character o higit pa.';
 if(c.indexOf('requires-recent')>=0)return'Mag-login ulit bago palitan ang password.';
 if(c==='lp/badname')return'Username: 3 hanggang 30 na letra, numero, tuldok, dash o underscore lang.';
 if(e instanceof TypeError)return'Hindi ma-load ang Firebase. Kailangan ng internet sa unang bukas.';
 return'May error: '+(c||(e&&e.message)||'hindi alam');
};

function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var a=JSON.parse(localStorage.getItem(AK));return a&&a.users?a:null}catch(e){return null}}
function save(a){localStorage.setItem(AK,JSON.stringify(a))}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2)}).join('')}
function rnd(n){var a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<n;i++)a[i]=Math.random()*256|0;return hex(a)}
function fb(t){var h1=5381,h2=52711;for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);h1=((h1<<5)+h1)^c;h2=((h2<<5)+h2)^c}return(h1>>>0).toString(16)+(h2>>>0).toString(16)}
function hashPw(pw,salt){
 var enc=window.TextEncoder?new TextEncoder():null;
 if(enc&&window.crypto&&crypto.subtle){
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
   return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256)}).then(function(b){return'p:'+hex(b)})
   .catch(function(){return'f:'+fb(salt+pw)});
 }
 return Promise.resolve('f:'+fb(salt+pw));
}
function mk(u,role,pw){var salt=rnd(12);return hashPw(pw,salt).then(function(h){return{u:u,role:role,salt:salt,hash:h}})}
function find(a,u){u=String(u).trim().toLowerCase();for(var i=0;i<a.users.length;i++)if(a.users[i].u.toLowerCase()===u)return a.users[i];return null}
function genCode(){var ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='',r=rnd(8);for(var i=0;i<8;i++)s+=ch[parseInt(r.substr(i,1),16)*2%ch.length+(i%2)];return s.slice(0,4)+'-'+s.slice(4)}
function normCode(c){return String(c).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function getSession(){if(cloud)return cs;var raw=sessionStorage.getItem(SK)||localStorage.getItem(SK);if(!raw)return null;try{var s=JSON.parse(raw),a=load();if(!a||!s)return null;var u=find(a,s.u);return u?{u:u.u,role:u.role}:null}catch(e){return null}}
function setSession(u,remember){var v=JSON.stringify({u:u.u});sessionStorage.removeItem(SK);localStorage.removeItem(SK);(remember?localStorage:sessionStorage).setItem(SK,v)}
function logout(){if(cloud){var rl=function(){location.reload()};LPCloud.logout().then(rl,rl);return}sessionStorage.removeItem(SK);localStorage.removeItem(SK);location.reload()}

function buildGate(){
 gate=document.createElement('div');gate.id='lp-gate';
 var b='';for(var i=0;i<14;i++){var sz=10+Math.random()*34;b+='<span class="bub" style="left:'+(Math.random()*100).toFixed(1)+'%;width:'+sz.toFixed(0)+'px;height:'+sz.toFixed(0)+'px;animation-duration:'+(11+Math.random()*14).toFixed(1)+'s;animation-delay:-'+(Math.random()*20).toFixed(1)+'s;--dx:'+((Math.random()*60-30)|0)+'px"></span>'}
 gate.innerHTML=b+'<div id="lp-card" role="dialog" aria-modal="true" aria-label="Login"></div>';
 document.body.appendChild(gate);card=$('#lp-card');
}
function pw(id,label,ph,ac){return'<label for="'+id+'">'+label+'</label><div class="fld"><input id="'+id+'" type="password" placeholder="'+ph+'" autocomplete="'+ac+'"><button type="button" class="eye" data-eye="'+id+'" aria-label="Ipakita o itago ang password">Show</button></div>'}
function head(t,s){return'<img id="lp-logo" src="'+LOGO+'" alt="La Princesa Aquaspin Laundry Hub"><h1>'+t+'</h1><p class="sub">'+s+'</p>'}
function wire(){
 [].forEach.call(card.querySelectorAll('[data-eye]'),function(btn){btn.onclick=function(){var i=document.getElementById(btn.getAttribute('data-eye'));var show=i.type==='password';i.type=show?'text':'password';btn.textContent=show?'Hide':'Show'}});
 var f=card.querySelector('input');if(f&&window.innerWidth>700)f.focus();
}
function err(t){var e=$('.err',card);if(e)e.textContent=t||'';if(t){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}}
function busy(b,on){b.disabled=on}

function viewLogin(msg){
 card.innerHTML=head('Maligayang pagbabalik','Mag-login para magamit ang POS.')+
 '<label for="lp-u">'+(cloud?'Username o email':'Username')+'</label><div class="fld"><input id="lp-u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="'+(cloud?'Username o email':'Username')+'"></div>'+
 pw('lp-p','Password','Password','current-password')+
 '<div class="row"><label><input id="lp-r" type="checkbox"> Tandaan ako sa device na ito</label></div>'+
 '<div class="row" style="margin-top:0"><button type="button" class="lnk" id="lp-forgot" style="background:none;border:0;color:#ffb3d9;font-weight:700;text-decoration:underline;padding:6px 0;font-size:13px">Nakalimutan ang password?</button></div>'+
 '<button class="go" id="lp-go" type="button">Mag-login</button><div class="err" role="alert">'+(msg||'')+'</div><div class="foot">La Princesa Aquaspin Laundry Hub</div>';
 wire();
 var go=$('#lp-go');
 function submit(){
  var lock=+localStorage.getItem(LK)||0;
  if(Date.now()<lock){err('Masyadong maraming maling subok. Maghintay ng '+Math.ceil((lock-Date.now())/1000)+' segundo.');return}
  var u=$('#lp-u').value.trim(),p=$('#lp-p').value;
  if(!u||!p){err('Ilagay ang username at password.');return}
  if(cloud){busy(go,true);LPCloud.signIn(u,p,$('#lp-r').checked).then(enter).catch(function(e){busy(go,false);err(LPCloud.msg(e))});return}
  var a=load(),user=a&&find(a,u);
  busy(go,true);
  (user?hashPw(p,user.salt):Promise.resolve(null)).then(function(h){
   busy(go,false);
   if(user&&h===user.hash){fails=0;localStorage.removeItem(LK);setSession(user,$('#lp-r').checked);unlock();return}
   fails++;if(fails>=5){fails=0;localStorage.setItem(LK,String(Date.now()+30000));err('5 maling subok. Maghintay ng 30 segundo.')}else err('Mali ang username o password.');
  });
 }
 go.onclick=submit;
 card.onkeydown=function(e){if(e.key==='Enter')submit()};
 $('#lp-forgot').onclick=cloud?viewForgotCloud:viewForgot;
}
var fails=0;

function viewSetup(){
 card.innerHTML=head('Gawin ang Owner account','Isang beses lang ito. Ito ang magiging password ng may-ari ng shop.')+
 '<label for="lp-u">Username</label><div class="fld"><input id="lp-u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="hal. owner"></div>'+
 pw('lp-p','Password (6 o higit pang character)','Password','new-password')+
 pw('lp-p2','Ulitin ang password','Password ulit','new-password')+
 '<button class="go" id="lp-go" type="button">Gawin ang account</button><div class="err" role="alert"></div>';
 wire();
 var go=$('#lp-go');
 function submit(){
  var u=$('#lp-u').value.trim(),p=$('#lp-p').value,p2=$('#lp-p2').value;
  if(u.length<3){err('Ang username ay dapat 3 character o higit pa.');return}
  if(p.length<6){err('Ang password ay dapat 6 character o higit pa.');return}
  if(p!==p2){err('Hindi magkapareho ang dalawang password.');return}
  busy(go,true);
  var code=genCode(),rsalt=rnd(12);
  Promise.all([mk(u,'owner',p),hashPw(normCode(code),rsalt)]).then(function(r){
   save({users:[r[0]],rec:{salt:rsalt,hash:r[1]}});
   setSession(r[0],false);viewCode(code);
  });
 }
 go.onclick=submit;card.onkeydown=function(e){if(e.key==='Enter')submit()};
}
function viewCode(code){
 card.innerHTML=head('I-save ang recovery code','Kailangan ito kung makalimutan mo ang password. Lalabas lang ito ngayon.')+
 '<div class="code" id="lp-code">'+code+'</div>'+
 '<button class="go" id="lp-copy" type="button" style="margin-top:0;background:rgba(255,255,255,.14);box-shadow:none">Kopyahin ang code</button>'+
 '<p class="note">I-screenshot o isulat ito at itago sa ligtas na lugar.</p>'+
 '<button class="go" id="lp-go" type="button">Na-save ko na, pasok na</button>';
 $('#lp-copy').onclick=function(){var b=this;try{navigator.clipboard.writeText(code).then(function(){b.textContent='Nakopya na'})}catch(e){b.textContent='Pindutin nang matagal ang code para kopyahin'}};
 $('#lp-go').onclick=unlock;card.onkeydown=null;
}
function viewForgot(){
 card.innerHTML=head('I-reset ang password','Ilagay ang recovery code ng Owner at ang bagong password.')+
 '<label for="lp-c">Recovery code</label><div class="fld"><input id="lp-c" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX"></div>'+
 pw('lp-p','Bagong password','Bagong password','new-password')+
 '<button class="go" id="lp-go" type="button">I-save ang bagong password</button><div class="row" style="justify-content:center"><button type="button" id="lp-back" style="background:none;border:0;color:#ffb3d9;font-weight:700;text-decoration:underline;padding:6px 0;font-size:13px">Bumalik sa login</button></div><div class="err" role="alert"></div>'+
 '<p class="note">Nawala ang code? Ang data ng POS ay hindi mabubura, pero kailangan ng may-ari ng bagong setup. I-export muna ang backup kung may access ka pa.</p>';
 wire();
 $('#lp-back').onclick=function(){viewLogin()};
 var go=$('#lp-go');
 go.onclick=function(){
  var a=load(),c=normCode($('#lp-c').value),p=$('#lp-p').value;
  if(!a||!a.rec){err('Walang recovery code sa device na ito.');return}
  if(p.length<6){err('Ang password ay dapat 6 character o higit pa.');return}
  busy(go,true);
  hashPw(c,a.rec.salt).then(function(h){
   if(h!==a.rec.hash){busy(go,false);err('Mali ang recovery code.');return}
   var o=a.users.filter(function(x){return x.role==='owner'})[0];
   return mk(o.u,'owner',p).then(function(n){o.salt=n.salt;o.hash=n.hash;save(a);viewLogin('Napalitan na ang password. Mag-login na.')});
  });
 };
}

function viewLoading(t){card.innerHTML=head('Sandali lang',t||'Inihahanda ang POS...');card.onkeydown=null}
function viewCloudError(e){

 $('#lp-go').onclick=startCloud;
 $('#lp-back').onclick=function(){LPCloud.logout().then(function(){viewLogin()},function(){viewLogin()})};
 card.onkeydown=null;
}
function viewForgotCloud(){
 card.innerHTML=head('I-reset ang password','Magpapadala ng reset link sa email ng account.')+
 '<label for="lp-c">Email</label><div class="fld"><input id="lp-c" type="text" autocapitalize="none" autocomplete="email" spellcheck="false" placeholder="email@halimbawa.com"></div>'+
 '<button class="go" id="lp-go" type="button">Ipadala ang reset link</button><div class="row" style="justify-content:center"><button type="button" id="lp-back" style="background:none;border:0;color:#ffb3d9;font-weight:700;text-decoration:underline;padding:6px 0;font-size:13px">Bumalik sa login</button></div><div class="err" role="alert"></div>'+
 '<p class="note">Para sa Staff na walang email, hilingin sa Owner na burahin at gumawa ng bagong account.</p>';
 wire();
 $('#lp-back').onclick=function(){viewLogin()};
 var go=$('#lp-go');
 go.onclick=function(){
  var v=$('#lp-c').value.trim();
  if(v.indexOf('@')<1||/@laprincesa-pos\.app$/i.test(v)){err('Ilagay ang totoong email ng account.');return}
  busy(go,true);
  LPCloud.reset(v).then(function(){viewLogin('Naipadala na ang reset link. Tingnan ang email mo.')},function(e){busy(go,false);err(LPCloud.msg(e))});
 };
}
function enter(user){
 var again=sessionStorage.getItem('lp_rl');sessionStorage.removeItem('lp_rl');
 viewLoading('Kinukuha ang data ng shop...');
 return LPCloud.role(user).then(function(r){
  if(!r){return LPCloud.logout().then(function(){viewLogin('Walang access ang account na ito. Hilingin sa Owner na idagdag ka.')})}
  cs={u:r.username||user.email,role:r.role};
  return LPCloud.hydrate().then(function(res){
   if(res.changed&&!again){sessionStorage.setItem('lp_rl','1');location.reload();return}
   unlock();
  });
 });
}
function startCloud(){
 viewLoading('Sandali lang...');
 LPCloud.ready().then(function(user){if(!user){viewLogin();return}return enter(user)}).catch(function(e){viewCloudError(e)});
}
function cloudAccounts(s){
 var o=overlay('<h3>Mga Account</h3><div id="lp-ul"><div class="u"><span>Sandali...</span></div></div>'+
  '<h4>Magdagdag ng Staff</h4><input id="lp-nu" type="text" placeholder="Username ng staff" autocapitalize="none"><input id="lp-np" type="password" placeholder="Password (6+ character)"><button id="lp-add" class="pk">Idagdag ang staff</button>'+
  '<h4>Palitan ang password ko</h4><input id="lp-cur" type="password" placeholder="Kasalukuyang password"><input id="lp-cp" type="password" placeholder="Bagong password (6+ character)"><button id="lp-chg">I-save ang bagong password</button><button id="lp-x">Isara</button>');
 $('#lp-x',o).onclick=function(){o.remove()};
 function render(){
  LPCloud.users().then(function(a){
   $('#lp-ul',o).innerHTML=a.map(function(u){return'<div class="u"><span>'+esc(u.username)+' <small>'+(u.role==='owner'?'Owner':'Staff')+'</small></span>'+(u.role==='staff'?'<button class="sm rd" data-del="'+esc(u.uid)+'" data-n="'+esc(u.username)+'">Burahin</button>':'')+'</div>'}).join('');
   [].forEach.call(o.querySelectorAll('[data-del]'),function(b){b.onclick=function(){
    if(!confirm('Alisin ang access ni '+b.getAttribute('data-n')+'?'))return;
    LPCloud.removeStaff(b.getAttribute('data-del')).then(function(){toast('Naalis na ang access');render()},function(e){toast(LPCloud.msg(e))});
   }});
  }).catch(function(e){toast(LPCloud.msg(e))});
 }
 render();
 $('#lp-add',o).onclick=function(){
  var u=$('#lp-nu',o).value.trim(),p=$('#lp-np',o).value,b=this;
  if(p.length<6)return toast('Ang password ay dapat 6 character o higit pa.');
  b.disabled=true;
  LPCloud.addStaff(u,p).then(function(){toast('Naidagdag si '+u);$('#lp-nu',o).value='';$('#lp-np',o).value='';b.disabled=false;render()},function(e){b.disabled=false;toast(LPCloud.msg(e))});
 };
 $('#lp-chg',o).onclick=function(){
  var c=$('#lp-cur',o).value,n=$('#lp-cp',o).value;
  if(n.length<6)return toast('Ang password ay dapat 6 character o higit pa.');
  LPCloud.changePw(c,n).then(function(){toast('Napalitan na ang password');$('#lp-cur',o).value='';$('#lp-cp',o).value=''},function(e){toast(LPCloud.msg(e))});
 };
}
function syncNow(){
 toast('Nagsi-sync...');
 LPCloud.syncNow().then(function(r){if(r.changed){sessionStorage.setItem('lp_rl','1');toast('May bagong data. Nagre-reload...');setTimeout(function(){location.reload()},900)}else toast('Updated na ang data')},function(e){toast(LPCloud.msg(e))});
}

/* Settings integration */
function overlay(html){var o=document.createElement('div');o.id='lp-acc-ov';o.innerHTML='<div id="lp-acc">'+html+'</div>';document.body.appendChild(o);o.addEventListener('click',function(e){if(e.target===o)o.remove()});return o}
function toast(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:300000;background:#111;color:#fff;padding:10px 14px;border-radius:12px;font:600 13px system-ui;max-width:90%';document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function staffPanel(s){
 var o=overlay('<h3>Settings</h3><p style="font-size:14px;color:#cfcfe8;margin:0 0 8px">Naka-login bilang <b>'+esc(s.u)+'</b> (Staff). Ang Owner lang ang may access sa Settings at backup.</p>'+(cloud?'<button id="lp-sy">Mag-sync ngayon</button>':'')+'<button id="lp-lo" class="rd">Mag-logout</button><button id="lp-x">Isara</button>');
 $('#lp-lo',o).onclick=logout;if(cloud)$('#lp-sy',o).onclick=function(){o.remove();syncNow()};$('#lp-x',o).onclick=function(){o.remove()};
}
function accounts(s){
 var a=load();
 var list=a.users.map(function(u){return'<div class="u"><span>'+esc(u.u)+' <small>'+(u.role==='owner'?'Owner':'Staff')+'</small></span>'+(u.role==='staff'?'<button class="sm rd" data-del="'+esc(u.u)+'">Burahin</button>':'')+'</div>'}).join('');
 var opts=a.users.map(function(u){return'<option>'+esc(u.u)+'</option>'}).join('');
 var o=overlay('<h3>Mga Account</h3>'+list+
  '<h4>Magdagdag ng Staff</h4><input id="lp-nu" type="text" placeholder="Username ng staff" autocapitalize="none"><input id="lp-np" type="password" placeholder="Password (6+ character)"><button id="lp-add" class="pk">Idagdag ang staff</button>'+
  '<h4>Palitan ang password</h4><select id="lp-sel">'+opts+'</select><input id="lp-cp" type="password" placeholder="Bagong password (6+ character)"><button id="lp-chg">I-save ang bagong password</button><button id="lp-x">Isara</button>');
 $('#lp-x',o).onclick=function(){o.remove()};
 [].forEach.call(o.querySelectorAll('[data-del]'),function(b){b.onclick=function(){var n=b.getAttribute('data-del');if(!confirm('Burahin ang account ni '+n+'?'))return;var x=load();x.users=x.users.filter(function(u){return u.u!==n});save(x);o.remove();accounts(s)}});
 $('#lp-add',o).onclick=function(){
  var u=$('#lp-nu',o).value.trim(),p=$('#lp-np',o).value,x=load();
  if(u.length<3)return toast('Ang username ay dapat 3 character o higit pa.');
  if(p.length<6)return toast('Ang password ay dapat 6 character o higit pa.');
  if(find(x,u))return toast('May gumagamit na ng username na iyan.');
  mk(u,'staff',p).then(function(n){x=load();x.users.push(n);save(x);toast('Naidagdag si '+u);o.remove();accounts(s)});
 };
 $('#lp-chg',o).onclick=function(){
  var n=$('#lp-sel',o).value,p=$('#lp-cp',o).value,x=load(),t=find(x,n);
  if(p.length<6)return toast('Ang password ay dapat 6 character o higit pa.');
  mk(t.u,t.role,p).then(function(r){t.salt=r.salt;t.hash=r.hash;save(x);toast('Napalitan ang password ni '+t.u);o.remove()});
 };
}
function hookSettings(){
 var orig=window.openSettings;
 window.openSettings=function(){
  var s=getSession();if(!s){location.reload();return}
  if(s.role!=='owner'){staffPanel(s);return}
  if(typeof orig==='function')orig.apply(this,arguments);
  var box=$('#set-box'),x=$('#s-x');if(!box||!x)return;
  var b1=document.createElement('button');b1.className='sb';b1.textContent='Mga Account at password';b1.onclick=function(){var o=$('#set-ov');if(o)o.remove();if(cloud)cloudAccounts(s);else accounts(s)};
  var b2=document.createElement('button');b2.className='sb red';b2.textContent='Mag-logout ('+s.u+')';b2.onclick=logout;
  if(cloud){var b3=document.createElement('button');b3.className='sb';b3.textContent='Mag-sync ngayon';b3.onclick=function(){var o=$('#set-ov');if(o)o.remove();syncNow()};box.insertBefore(b3,x)}
  box.insertBefore(b1,x);box.insertBefore(b2,x);
 };
}

function start(){
 hookSettings();
 if(cloud){buildGate();startCloud();return}
 var a=load(),s=getSession();
 if(s){unlock();return}
 buildGate();
 if(!a||!a.users.length)viewSetup();else viewLogin();
}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
