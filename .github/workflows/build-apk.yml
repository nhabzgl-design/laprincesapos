name: Build Native APK

on:
  push:
    branches: [ main, fix-main-apk-workflow, stable/apk-235-baseline ]
  pull_request:
    branches: [main, fix/calendar-on-223-preserve-print, stable/apk-235-baseline, build/ewallet-pr21-trigger]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'
      - name: Prepare bundled POS HTML and launcher icon
        run: |
          mkdir -p app/src/main/assets app/src/main/res/mipmap-nodpi
          cp index.html app/src/main/assets/index.html
          cp icon-maskable-512.png app/src/main/res/mipmap-nodpi/ic_launcher.png
          test -s app/src/main/assets/index.html
          test -s app/src/main/res/mipmap-nodpi/ic_launcher.png
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import subprocess, tempfile, os
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.current = (dict(attrs), [])
              def handle_data(self, data):
                  if self.current is not None:
                      self.current[1].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.items.append((self.current[0], "".join(self.current[1])))
                      self.current = None
          parser = Scripts()
          with open("index.html", encoding="utf-8") as source:
              parser.feed(source.read())
          checked = 0
          for attrs, body in parser.items:
              if attrs.get("src") or attrs.get("type", "").lower() == "application/json" or not body.strip():
                  continue
              suffix = ".mjs" if attrs.get("type", "").lower() == "module" else ".js"
              path = os.path.join(tempfile.gettempdir(), "lp-inline-%d%s" % (checked, suffix))
              with open(path, "w", encoding="utf-8") as out:
                  out.write(body)
              subprocess.run(["node", "--check", path], check=True)
              checked += 1
          print("Validated %d inline JavaScript blocks." % checked)
          PY
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LaPrincesa-Test-Native-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare private release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/lp-release.jks
            test -s app/lp-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_FILE: lp-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LaPrincesa-Test-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
