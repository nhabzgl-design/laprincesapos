name: iOS Owner PWA Checks

on:
  push:
    branches:
      - ios-owner-monitoring-dev
    paths:
      - "ios-owner/**"
      - ".github/workflows/ios-owner-check.yml"
  pull_request:
    paths:
      - "ios-owner/**"
      - ".github/workflows/ios-owner-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-owner-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.capture = True
                      script_type = attrs.get("type", "").lower().split(";")[0].strip()
                      self.external = "src" in attrs or script_type in ("application/json", "application/ld+json", "importmap")
                      self.parts = []
              def handle_data(self, data):
                  if self.capture and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.capture:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.capture = False
                      self.external = False

          html = Path("ios-owner/index.html").read_text(encoding="utf-8")
          parser = Scripts()
          parser.feed(html)
          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found")
          with tempfile.TemporaryDirectory() as td:
              for i, script in enumerate(parser.scripts, 1):
                  if not script.strip():
                      continue
                  file = Path(td) / f"script-{i}.js"
                  file.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(file)], check=True)
          print(f"Validated {len(parser.scripts)} inline script block(s).")
          PY

      - name: Validate PWA files and manifest
        run: |
          python3 -m json.tool ios-owner/manifest.webmanifest >/dev/null
          test -s ios-owner/index.html
          test -s ios-owner/firebase-config.js
          test -s ios-owner/sw.js
          grep -q "LP_OWNER_BUILD" ios-owner/index.html
          grep -q "role!=='owner'" ios-owner/index.html
          grep -q "projectId: \"laprincesa-pos\"" ios-owner/firebase-config.js
          ! grep -q "serviceAccount\|private_key" ios-owner/firebase-config.js
          grep -q "lpmeta_clear_generation_v1" ios-owner/index.html
          grep -q "cloudGeneration>localGeneration" ios-owner/index.html
          grep -q "getDocsFromServer" ios-owner/index.html
          grep -q "getDocFromServer" ios-owner/index.html
          grep -q "Number(d.g)!==cloudGeneration" ios-owner/index.html
