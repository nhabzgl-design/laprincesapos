name: iOS Owner PWA Checks
on:
  push:
    branches: [ios-owner-monitoring-dev]
    paths: ["ios-owner/**", ".github/workflows/ios-owner-check.yml", "tests/ios-owner-monitoring.test.mjs"]
  pull_request:
    paths: ["ios-owner/**", ".github/workflows/ios-owner-check.yml", "tests/ios-owner-monitoring.test.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-owner-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.capture=False; self.external=False; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script":
                      a=dict(attrs); t=a.get("type","").strip().lower()
                      self.capture=t in {"","module","text/javascript","application/javascript"}
                      self.external="src" in a; self.parts=[]
              def handle_data(self,data):
                  if self.capture and not self.external:self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=="script":
                      if self.capture and not self.external:self.scripts.append("".join(self.parts))
                      self.capture=False; self.external=False
          p=Scripts(); p.feed(Path("ios-owner/index.html").read_text(encoding="utf-8"))
          if not p.scripts: raise SystemExit("No inline JavaScript found")
          with tempfile.TemporaryDirectory() as td:
              for i,s in enumerate(p.scripts,1):
                  if not s.strip(): continue
                  f=Path(td)/f"inline-{i}.mjs"; f.write_text(s,encoding="utf-8")
                  subprocess.run(["node","--check",str(f)],check=True)
          print(f"Validated {len(p.scripts)} inline script block(s).")
          PY
      - name: Validate Owner monitoring scope and PWA files
        run: |
          python3 -m json.tool ios-owner/manifest.webmanifest >/dev/null
          test -s ios-owner/index.html
          test -s ios-owner/firebase-config.js
          test -s ios-owner/sw.js
          grep -q 'projectId: "laprincesa-pos"' ios-owner/firebase-config.js
          grep -q "onSnapshot" ios-owner/index.html
          grep -q "runTransaction" ios-owner/index.html
          grep -q "CLEAR_KEYS" ios-owner/index.html
          ! grep -qi "create order\|checkout\|add to cart\|new order" ios-owner/index.html
          node --test tests/ios-owner-monitoring.test.mjs
