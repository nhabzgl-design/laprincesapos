name: Firestore Rules Emulator Tests

on:
  push:
    branches:
      - shared-db-android-bridge-dev
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/firestore-rules-emulator.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/firestore-rules-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install emulator and test dependencies
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Run Firestore rules tests in the Emulator
        run: npx firebase emulators:exec --only firestore --project demo-laprincesa-pos-rules "node --test tests/firestore.rules.test.mjs"
