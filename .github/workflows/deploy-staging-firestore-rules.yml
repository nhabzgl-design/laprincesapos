name: Deploy Staging Firestore Rules

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-staging-rules
  cancel-in-progress: false

jobs:
  deploy-staging-rules:
    if: github.ref == 'refs/heads/owner-monitoring-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: la-princesa-pos-staging
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Verify deployment target and rules file
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          if (cfg.firestore?.rules !== 'firestore.rules') {
            throw new Error('Unexpected Firestore rules path; deployment stopped.');
          }
          const rules = fs.readFileSync('firestore.rules', 'utf8');
          if (!rules.includes('match /databases/{database}/documents')) {
            throw new Error('Firestore rules file is missing or invalid.');
          }
          const web = fs.readFileSync('firebase-config.js', 'utf8');
          if (!web.includes('projectId: "la-princesa-pos-staging"')) {
            throw new Error('Staging Firebase config mismatch; deployment stopped.');
          }
          console.log('Target verified: la-princesa-pos-staging');
          NODE

      - name: Authenticate to Google Cloud (staging only)
        uses: google-github-actions/auth@v3
        with:
          project_id: la-princesa-pos-staging
          credentials_json: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules only to staging
        run: firebase deploy --only firestore:rules --project la-princesa-pos-staging --non-interactive
