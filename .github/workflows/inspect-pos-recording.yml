name: Inspect POS Screen Recording

on:
  workflow_dispatch:
  push:
    branches:
      - inspect-pos-recording-temp

permissions:
  contents: write

jobs:
  extract-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary inspection branch
        uses: actions/checkout@v4
        with:
          ref: inspect-pos-recording-temp

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Extract representative frames and build contact sheet
        run: |
          mkdir -p diagnostics/pos-recording-frames
          VIDEO="Screen_Recording_20261108_040630.mp4"
          test -f "$VIDEO"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO" > diagnostics/pos-recording-duration.txt
          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vf "fps=1,scale=480:-1:flags=lanczos" -q:v 3 diagnostics/pos-recording-frames/frame-%03d.jpg
          ffmpeg -hide_banner -loglevel error -pattern_type glob -i 'diagnostics/pos-recording-frames/*.jpg' -vf "tile=3x6:padding=12:margin=12:color=white" -frames:v 1 diagnostics/pos-recording-contact-sheet.jpg
          ls -lh diagnostics/pos-recording-contact-sheet.jpg diagnostics/pos-recording-duration.txt
          find diagnostics/pos-recording-frames -maxdepth 1 -type f | wc -l > diagnostics/pos-recording-frame-count.txt

      - name: Save inspection images to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          git commit -m "Add temporary POS recording inspection frames" || echo "No generated files to commit"
          git push origin HEAD:inspect-pos-recording-temp
