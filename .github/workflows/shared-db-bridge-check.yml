name: Shared Database Bridge Checks

on:
  push:
    branches:
      - shared-db-android-bridge-dev
      - owner-monitoring-staging
    paths:
      - "index.html"
      - "tests/clear-data-source.test.mjs"
      - "owner.html"
      - "owner.webmanifest"
      - "sw.js"
      - "firebase-config.js"
      - "firestore.rules"
      - "FIREBASE-SHARED-DATABASE-SETUP.md"
      - ".github/workflows/shared-db-bridge-check.yml"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "index.html"
      - "tests/clear-data-source.test.mjs"
      - "sw.js"
      - "firebase-config.js"
      - "firestore.rules"
      - "FIREBASE-SHARED-DATABASE-SETUP.md"
      - ".github/workflows/shared-db-bridge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shared-db-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.skip = False
                  self.kind = ""
                  self.parts = []
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.capture = True
                      self.kind = attrs.get("type", "").lower().strip()
                      self.skip = "src" in attrs or self.kind in ("application/json", "application/ld+json", "importmap")
                      self.parts = []
              def handle_data(self, data):
                  if self.capture and not self.skip:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.capture:
                      if not self.skip and "".join(self.parts).strip():
                          self.items.append((self.kind, "".join(self.parts)))
                      self.capture = False
                      self.skip = False

          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.items:
              raise SystemExit("No inline JavaScript found")
          with tempfile.TemporaryDirectory() as td:
              for i, (kind, source) in enumerate(parser.items, 1):
                  suffix = ".mjs" if kind == "module" else ".js"
                  file = Path(td) / f"inline-{i}{suffix}"
                  file.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(file)], check=True)
          print(f"Syntax OK: {len(parser.items)} inline JavaScript blocks")
          PY

      - name: Validate Owner Monitor PWA
        run: |
          python3 -m json.tool owner.webmanifest >/dev/null
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile
          class ModuleScripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='script' and dict(attrs).get('type','').lower()=='module':
                      self.active=True; self.parts=[]
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.active:
                      self.scripts.append(''.join(self.parts)); self.active=False
          p=ModuleScripts(); p.feed(Path('owner.html').read_text(encoding='utf-8'))
          if len(p.scripts)!=1: raise SystemExit('Expected exactly one Owner Monitor module script')
          with tempfile.NamedTemporaryFile('w',suffix='.mjs') as f:
              f.write(p.scripts[0]); f.flush(); subprocess.run(['node','--check',f.name],check=True)
          print('Owner Monitor module syntax OK')
          PY
          grep -q "onSnapshot" owner.html
          grep -q "verifyOwner" owner.html
      - name: Validate PWA and Firebase bridge files
        run: |
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          node --check firebase-config.js
          test -s firestore.rules
          grep -q "onSnapshot" index.html
          grep -q "role!=='owner'&&d.role!=='staff'" index.html
          grep -q "firebase-config.js" index.html
          grep -q "cp firebase-config.js app/src/main/assets/firebase-config.js" .github/workflows/build-apk.yml
          grep -q "test -s app/src/main/assets/firebase-config.js" .github/workflows/build-apk.yml
          grep -q "printHtmlBase64" index.html
          node --test tests/clear-data-source.test.mjs
          echo "PWA, Firestore bridge, Clear Data regression, role check, and printer hook checks passed."
