plugins { id 'com.android.application' }
android {
  namespace 'com.laprincesa.pos'
  compileSdk 34
  defaultConfig {
    applicationId 'com.laprincesa.pos'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  sourceSets {
    main {
      assets.srcDirs = ['../']
      assets.include 'index.html'
    }
  }
  buildTypes { release { minifyEnabled false } }
}

// Declare the dependency required by AGP's release lint analysis task.
tasks.configureEach {
  if (name == 'lintVitalAnalyzeRelease') {
    dependsOn('checkReleaseDuplicateClasses')
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.webkit:webkit:1.10.0'
}