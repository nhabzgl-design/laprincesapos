plugins { id 'com.android.application' }
android {
  namespace 'com.laprincesa.pos'
  compileSdk 34
  defaultConfig {
    applicationId 'com.laprincesa.pos'
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName '1.1'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  signingConfigs {
    release {
      storeFile file('lp-release.jks')
      storePassword 'laprincesa2026'
      keyAlias 'lp'
      keyPassword 'laprincesa2026'
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
