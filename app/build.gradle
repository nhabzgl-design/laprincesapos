plugins { id 'com.android.application' }

android {
  namespace 'com.laprincesa.pos'
  compileSdk 34
  defaultConfig {
    applicationId 'com.laprincesa.pos'
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName '1.1'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  // Release credentials are supplied only by GitHub Actions Secrets.
  signingConfigs {
    release {
      storeFile file(System.getenv('ANDROID_KEYSTORE_FILE') ?: 'missing-release-key.jks')
      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
      keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
      keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
}
